[package]
name = "aure"
version = "0.1.0"
description = "aure · 本地写真收藏"
edition = "2021"
license = "MIT"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde_json = "1"
percent-encoding = "2"
kamadak-exif = "0.6.1"

# Keep the default speed optimization; eliminate duplicate code across crates.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
