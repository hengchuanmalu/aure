name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo install cargo-audit --locked
      - run: npx playwright install msedge
      - name: Install media test tools
        run: |
          choco install ffmpeg --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          ffmpeg -version
          ffprobe -version
      - name: Release verification
        run: npm run verify:release
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: aure-windows-x64
          path: |
            src-tauri/target/release/aure.exe
            src-tauri/target/release/bundle/nsis/*.exe
            resources/third-party-licenses.txt
            LICENSE
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: verification/release/
          retention-days: 7
